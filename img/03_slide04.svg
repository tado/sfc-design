    <polygon points="900,205 1010,255 900,305 790,255" fill="#fff" stroke="#2277cc" stroke-width="3"/>
    <text x="900" y="264" fill="#2277cc">条件</text>
    <line x1="900" y1="305" x2="900" y2="343" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="935" y="335" font-size="20" fill="#444" text-anchor="start">true</text>
    <rect x="800" y="350" width="200" height="70" rx="8" fill="#2277cc"/>
    <text x="900" y="394" fill="#fff">処理</text>
    <path d="M800,385 H760 V255 H783" fill="none" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1010,255 H1050 V470" fill="none" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1030" y="240" font-size="20" fill="#444">false</text>
