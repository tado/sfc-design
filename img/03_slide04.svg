    <text x="530" y="264" fill="#2277cc">条件</text>
    <path d="M420,255 H400 V343" fill="none" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M640,255 H660 V343" fill="none" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="330" y="350" width="140" height="70" rx="8" fill="#2277cc"/>
    <text x="400" y="394" fill="#fff">処理A</text>
    <rect x="590" y="350" width="140" height="70" rx="8" fill="#2277cc"/>
    <text x="660" y="394" fill="#fff">処理B</text>

    <!-- 反復 -->
    <text x="900" y="40" fill="#2277cc" font-weight="bold">反復</text>
