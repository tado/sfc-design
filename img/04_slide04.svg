<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <text x="230" y="38" text-anchor="middle" font-size="30" fill="#444">プログラム開始</text>
  <line x1="230" y1="56" x2="230" y2="104" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="60" y="110" width="340" height="90" rx="10" fill="#2277cc"/>
  <text x="230" y="166" text-anchor="middle" font-size="36" fill="#fff" font-family="Menlo, monospace">setup()</text>
  <line x1="230" y1="200" x2="230" y2="248" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="60" y="254" width="340" height="90" rx="10" fill="#2277cc"/>
  <text x="230" y="310" text-anchor="middle" font-size="36" fill="#fff" font-family="Menlo, monospace">draw()</text>
  <path d="M400,299 H470 V400 H230 V352" fill="none" stroke="#444" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="495" y="350" font-size="28" fill="#444">プログラムが終了するまで</text>
  <text x="495" y="390" font-size="28" fill="#444">くりかえし</text>
